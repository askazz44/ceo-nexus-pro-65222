<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GainFlow" />
    <meta name="theme-color" content="#8B5CF6" />
    <link rel="apple-touch-icon" href="/pwa-icon-192-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Primary Meta Tags -->
    <title>GainFlow - Project Finance Tracker for Freelancers & Small Businesses</title>
    <meta name="title" content="GainFlow - Project Finance Tracker for Freelancers & Small Businesses" />
    <meta name="description" content="Track income and expenses per project. Import from 25+ banks (US, UK, EU). Generate PDF reports. Perfect for freelancers, agencies and small businesses." />
    <meta name="author" content="Ascanio Vecchio" />
    <meta name="keywords" content="project finance, expense tracker, freelancer accounting, small business finance, income tracking, CSV import, PDF reports, multi-project, Chase, Bank of America, Barclays, N26, Revolut" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gainflow.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gainflow.app/" />
    <meta property="og:title" content="GainFlow - Project Finance Tracker for Freelancers" />
    <meta property="og:description" content="Track income and expenses per project. Import from 25+ banks worldwide. Generate professional PDF reports. Free to start." />
    <meta property="og:image" content="https://gainflow.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="GainFlow" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="it_IT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://gainflow.app/" />
    <meta name="twitter:title" content="GainFlow - Project Finance Tracker" />
    <meta name="twitter:description" content="Track income and expenses per project. Import from 25+ banks. Perfect for freelancers." />
    <meta name="twitter:image" content="https://gainflow.app/og-image.png" />
    <meta name="twitter:creator" content="@ascaniovecchio" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "GainFlow",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, iOS, Android (PWA)",
      "description": "Project-based financial management for freelancers and small businesses. Track income and expenses per project, import from 25+ banks, generate PDF reports.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier with 2 projects"
      },
      "author": {
        "@type": "Person",
        "name": "Ascanio Vecchio",
        "url": "https://www.linkedin.com/in/ascanio-vecchio-110990384"
      },
      "featureList": [
        "Multi-project tracking",
        "CSV import from 25+ banks",
        "PDF report generation",
        "Budget alerts",
        "Multi-currency support",
        "PWA installable"
      ]
    }
    </script>

    <!-- Plausible Analytics (privacy-friendly) -->
    <script defer data-domain="gainflow.app" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
